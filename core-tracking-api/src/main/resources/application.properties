spring.application.name=core-tracking-api

# ---------------------------------------------------------------------------
# Database: H2 in-memory (all data is lost when the application stops)
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:coredb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate creates the "cores" table from the Core entity, then data.sql inserts the sample rows.
# (defer-datasource-initialization makes data.sql run AFTER Hibernate has created the table.)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.show-sql=false
# The service returns DTOs and nothing is lazily loaded, so the session is not kept open for the web layer.
spring.jpa.open-in-view=false

# H2 web console (development only): http://localhost:8080/h2-console
#   JDBC URL: jdbc:h2:mem:coredb   User: sa   Password: (empty)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------------------
# API
# ---------------------------------------------------------------------------
# A client cannot request more than 100 rows per page (the default page size is set in CoreController)
spring.data.web.pageable.max-page-size=100

# Swagger UI (springdoc-openapi): http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.com.example.coretracking=INFO
